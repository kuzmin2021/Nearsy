allprojects {
    repositories {
        maven {
            url uri("${rootDir}/local_maven_repo")
        }
        maven {
            url uri("${rootDir}/local_flutter_maven")
        }
        google()
        mavenCentral()
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.browser' &&
                    details.requested.name == 'browser') {
                details.useVersion '1.8.0'
            }
            if (details.requested.group == 'com.google.guava' &&
                    details.requested.name == 'listenablefuture') {
                details.useVersion '9999.0-empty-to-avoid-conflict-with-guava'
            }
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name in [
                            'kotlin-stdlib',
                            'kotlin-stdlib-common',
                            'kotlin-stdlib-jdk7',
                            'kotlin-stdlib-jdk8'
                    ]) {
                details.useVersion '2.3.0'
            }
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("kotlin")) {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
                kotlinOptions {
                    jvmTarget = "1.8"
                }
            }
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 36
            }
        }
        if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
